[project]
name = "openai-compat-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.2",
    "openai>=2.30.0",
    "pydantic>=2.12.5",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "openai-compat-gateway-client",
    "pytest>=9.0.2",
    "ruff>=0.12.0",
]

[tool.uv.sources]
openai-compat-gateway-client = { workspace = true }

[tool.uv.workspace]
members = ["packages/client"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]

[tool.pytest.ini_options]
markers = [
    "e2e: hits the real OpenAI API and requires explicit opt-in",
]
