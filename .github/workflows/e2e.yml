name: OpenAI E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    environment: openai-e2e
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --all-extras --dev --locked

      - run: ./scripts/test-e2e.sh -q
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
