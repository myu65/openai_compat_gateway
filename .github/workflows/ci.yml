name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --dev --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -m "not e2e" -q
      - run: ./scripts/test-client-wheel.sh "${{ matrix.python-version }}"

  client-langchain-compat:
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            langchain-openai-version: "0.3.35"
          - python-version: "3.13"
            langchain-openai-version: "0.3.35"
          - python-version: "3.13"
            langchain-openai-version: "1.0.0"
          - python-version: "3.13"
            langchain-openai-version: "1.1.0"
          - python-version: "3.13"
            langchain-openai-version: "1.2.0"
          - python-version: "3.13"
            langchain-openai-version: "1.3.0"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: >-
          uv run --python "${{ matrix.python-version }}"
          --project packages/client
          --with pytest
          --with "langchain-openai==${{ matrix.langchain-openai-version }}"
          pytest packages/client/tests -q

  client-vcs-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install the client with pip from the Git subdirectory
        env:
          CLIENT_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          package_url="openai-compat-gateway-client @ git+https://github.com/myu65/openai_compat_gateway.git@${CLIENT_GIT_REF}#subdirectory=packages/client"
          pip_test_root="$(mktemp -d)"
          uv venv "${pip_test_root}/venv" --python 3.13 --seed
          "${pip_test_root}/venv/bin/python" -m pip install "${package_url}"
          "${pip_test_root}/venv/bin/python" -c "from openai_compat_gateway_client import ChatOpenAICompat"
      - name: Install the client with uv from the Git subdirectory
        env:
          CLIENT_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          package_url="openai-compat-gateway-client @ git+https://github.com/myu65/openai_compat_gateway.git@${CLIENT_GIT_REF}#subdirectory=packages/client"
          uv_test_root="$(mktemp -d)"
          cd "${uv_test_root}"
          uv init --bare --python 3.13
          uv add "${package_url}"
          uv run python -c "from openai_compat_gateway_client import ChatOpenAICompat"
